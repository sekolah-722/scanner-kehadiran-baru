// ============================================================
// API APPS SCRIPT
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbw58lowucrJWunN2Bgs_FC0A9wB6CxGjkvU7APuh-QSxnjpsBa7ET-gPAjTkvQ39srwoQ/exec";


// ============================================================
// OFFLINE-FIRST / PWA
// ============================================================

const APP_CACHE_NAME = "sk-seri-serdang-scanner-v1";

async function daftarOfflineApp() {

  if (!("serviceWorker" in navigator)) {
    console.warn("Browser ini tidak menyokong Service Worker.");
    return;
  }

  // Service Worker inline tidak boleh didaftarkan secara terus.
  // Kita gunakan Blob supaya fail HTML ini kekal satu fail.
  const workerCode = `
    const CACHE_NAME = "${APP_CACHE_NAME}";

    self.addEventListener("install", event => {
      self.skipWaiting();
    });

    self.addEventListener("activate", event => {
      event.waitUntil(
        caches.keys().then(keys =>
          Promise.all(
            keys
              .filter(key => key !== CACHE_NAME)
              .map(key => caches.delete(key))
          )
        ).then(() => self.clients.claim())
      );
    });

    self.addEventListener("fetch", event => {

      const request = event.request;

      // Untuk navigasi, cuba cache dahulu supaya halaman
      // boleh dibuka semula ketika tiada internet.
      if (request.mode === "navigate") {

        event.respondWith(
          caches.match(request).then(cached => {

            if (cached) {
              return cached;
            }

            return fetch(request)
              .then(response => {

                if (response && response.ok) {

                  const copy = response.clone();

                  caches.open(CACHE_NAME)
                    .then(cache => cache.put(request, copy));

                }

                return response;

              })
              .catch(() => caches.match(location.href));

          })
        );

        return;
      }

      // Untuk aset same-origin, cache selepas berjaya dimuatkan.
      if (new URL(request.url).origin === location.origin) {

        event.respondWith(
          caches.match(request).then(cached => {

            if (cached) {
              return cached;
            }

            return fetch(request)
              .then(response => {

                if (response && response.ok) {

                  const copy = response.clone();

                  caches.open(CACHE_NAME)
                    .then(cache => cache.put(request, copy));

                }

                return response;

              });

          })
        );

      }

    });
  `;

  try {

    const blob =
      new Blob([workerCode], {
        type: "text/javascript"
      });

    const workerURL =
      URL.createObjectURL(blob);

    const registration =
      await navigator.serviceWorker.register(
        workerURL
      );

    console.log(
      "Offline-first Service Worker didaftarkan.",
      registration
    );

  } catch (error) {

    console.warn(
      "Service Worker tidak dapat didaftarkan:",
      error
    );

  }

}


// ============================================================
// PEMBOLEH UBAH
// ============================================================

let scanner = null;

let photoScanner = null;

let sedangProses = false;

let photoStream = null;

let muridUntukGambar = null;

let gambarBase64 = null;

// ============================================================
// KAMERA TELEFON: SCAN BERPANTAS / SUARA TAHNIAH
// Tiada perubahan kepada API, queue offline, USB atau kamera gambar.
// ============================================================
let scanBerterusan = false;
let scanBolehTerima = false;
let timerScanSeterusnya = null;
let qrDalamProses = "";
let qrSudahDibaca = new Set();
let suaraScanAktif = true;
let audioScanContext = null;

// Cubaan membuka audio dari tindakan pengguna (iPhone/Safari).
function sediaAudioScan() {
  if (!suaraScanAktif) return;
  try {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    if (AudioClass && !audioScanContext) audioScanContext = new AudioClass();
    if (audioScanContext && audioScanContext.state === "suspended") {
      audioScanContext.resume().catch(function() {});
    }
  } catch (error) {
    console.warn("Audio tidak dapat disediakan:", error);
  }
}

function tukarBunyiScan() {
  suaraScanAktif = !suaraScanAktif;
  const butang = document.getElementById("toggleBunyiScan");
  if (butang) butang.textContent = suaraScanAktif ? "🔊 SUARA: ON" : "🔇 SUARA: OFF";
  if (suaraScanAktif) sediaAudioScan();
}

function bunyiTahniah() {
  if (!suaraScanAktif || !scanBerterusan || usbMode) return;

  // Nada ringkas sebagai maklum balas walaupun suara sintesis tidak disokong.
  try {
    if (audioScanContext && audioScanContext.state === "running") {
      const now = audioScanContext.currentTime;
      [660, 880].forEach(function(freq, index) {
        const oscillator = audioScanContext.createOscillator();
        const volume = audioScanContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = freq;
        volume.gain.setValueAtTime(0.0001, now + index * 0.12);
        volume.gain.exponentialRampToValueAtTime(0.14, now + index * 0.12 + 0.018);
        volume.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.12 + 0.115);
        oscillator.connect(volume);
        volume.connect(audioScanContext.destination);
        oscillator.start(now + index * 0.12);
        oscillator.stop(now + index * 0.12 + 0.12);
      });
    }
  } catch (error) {
    console.warn("Nada scan tidak dapat dimainkan:", error);
  }

  // Web Speech bergantung pada sokongan dan tetapan suara telefon.
  try {
    if ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) {
      const ucapan = new SpeechSynthesisUtterance("Tahniah");
      ucapan.lang = "ms-MY";
      ucapan.rate = 1.05;
      ucapan.volume = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(ucapan);
    }
  } catch (error) {
    console.warn("Suara Tahniah tidak dapat dimainkan:", error);
  }
}

function simpanQRScanBerterusan() {
  if (qrDalamProses) qrSudahDibaca.add(qrDalamProses.toUpperCase());
}

// ============================================================
// OFFLINE QUEUE
// ============================================================

const OFFLINE_QUEUE_KEY = "SK_SERI_SERDANG_OFFLINE_QUEUE_V1";
let syncSedangBerjalan = false;
let onlineTimer = null;

function getOfflineQueue() {
  try {
    const data = JSON.parse(
      localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]"
    );

    return Array.isArray(data) ? data : [];

  } catch (error) {

    console.error("Gagal membaca offline queue:", error);
    return [];

  }
}

function setOfflineQueue(queue) {

  localStorage.setItem(
    OFFLINE_QUEUE_KEY,
    JSON.stringify(queue)
  );

  kemasKiniOfflineStatus();

}

function tambahOfflineQueue(qrID, masaScanAsal) {

  const queue = getOfflineQueue();

  const masaScan =
    masaScanAsal instanceof Date
      ? masaScanAsal
      : new Date();

  queue.push({
    qr: String(qrID || "").trim(),
    masaSimpan: masaScan.toISOString(),
    scanEpochMs: masaScan.getTime()
  });

  setOfflineQueue(queue);

}

function kemasKiniOfflineStatus() {

  const el = document.getElementById("offlineStatus");

  if (!el) return;

  const queue = getOfflineQueue();

  if (!navigator.onLine) {

    el.style.color = "#d93025";
    el.innerHTML =
      "🔴 OFFLINE" +
      (queue.length
        ? " — " + queue.length + " rekod menunggu"
        : " — Tiada rekod menunggu");

    return;

  }

  el.style.color = "#188038";

  if (syncSedangBerjalan) {

    el.innerHTML =
      "🔄 MENYELARASKAN " +
      queue.length +
      " REKOD...";

    return;

  }

  if (queue.length) {

    el.innerHTML =
      "🟠 ONLINE — " +
      queue.length +
      " rekod menunggu";

  } else {

    el.innerHTML =
      "🟢 ONLINE — Tiada rekod menunggu";

  }

}

function simpanDanMaklumOffline(qrID, masaScanAsal) {

  try {
    tambahOfflineQueue(qrID, masaScanAsal);
  } catch (error) {
    console.error("Gagal menyimpan queue offline:", error);
    document.getElementById("status").className = "error";
    document.getElementById("status").textContent = "❌ Rekod belum disimpan pada telefon. Semak ruang storan.";
    resetScanner();
    return;
  }

  simpanQRScanBerterusan();
  bunyiTahniah();

  document.getElementById("status").className = "info";

  document.getElementById("status").innerHTML =
    "📡 INTERNET TIADA<br>" +
    "💾 Scan disimpan sementara.<br>" +
    "Akan dihantar apabila internet kembali.";

  document.getElementById("result").innerHTML = "";

  resetScanner();

}

function hantarSatuQueue(item) {

  return new Promise(function(resolve) {

    const callbackName =
      "hasilQueue_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script =
      document.createElement("script");

    let selesai = false;

    function bersihkanDanSelesai(result) {

      if (selesai) return;

      selesai = true;

      clearTimeout(timeout);

      delete window[callbackName];

      if (script.parentNode) {
        script.remove();
      }

      resolve(result);

    }

    window[callbackName] =
      function(response) {

        // Apps Script sudah memberi respons.
        // Sama ada success atau already, server telah
        // menerima QR tersebut.
        bersihkanDanSelesai({
          ok: true,
          response: response
        });

      };

    script.id = callbackName;

    // Kekalkan masa QR sebenar. Queue lama yang hanya ada
    // masaSimpan juga ditukar semula kepada epoch di sini.
    const scannedAt =
      String((item && item.masaSimpan) || "");

    let scanEpochMs =
      Number(item && item.scanEpochMs);

    if (!Number.isFinite(scanEpochMs) || scanEpochMs <= 0) {
      const parsed = Date.parse(scannedAt);
      scanEpochMs = Number.isFinite(parsed) ? parsed : "";
    }

    script.src =
      API_URL +
      "?action=scan" +
      "&qr=" +
      encodeURIComponent((item && item.qr) || "") +
      "&scannedAt=" +
      encodeURIComponent(scannedAt) +
      "&scanEpochMs=" +
      encodeURIComponent(scanEpochMs) +
      "&callback=" +
      callbackName;

    script.onerror = function() {

      bersihkanDanSelesai({
        ok: false
      });

    };

    const timeout = setTimeout(function() {

      bersihkanDanSelesai({
        ok: false
      });

    }, 15000);

    document.body.appendChild(script);

  });

}


async function syncOfflineQueue() {

  if (syncSedangBerjalan) return;

  if (!navigator.onLine) {

    kemasKiniOfflineStatus();
    return;

  }

  let queue = getOfflineQueue();

  if (!queue.length) {

    kemasKiniOfflineStatus();
    return;

  }

  syncSedangBerjalan = true;
  kemasKiniOfflineStatus();

  while (queue.length && navigator.onLine) {

    const item = queue[0];

    const hasil =
      await hantarSatuQueue(item);

    if (!hasil.ok) {

      // Jangan buang item jika gagal.
      break;

    }

    // Hanya buang item pertama selepas Apps Script
    // memberi respons.
    queue.shift();

    localStorage.setItem(
      OFFLINE_QUEUE_KEY,
      JSON.stringify(queue)
    );

    kemasKiniOfflineStatus();

  }

  syncSedangBerjalan = false;

  kemasKiniOfflineStatus();

  if (!queue.length) {

    const status =
      document.getElementById("status");

    if (status) {

      status.className = "success";

      status.innerHTML =
        "✅ SEMUA REKOD OFFLINE TELAH DISEGERAKAN";

    }

  }

}


function mulaPantauInternet() {

  kemasKiniOfflineStatus();

  window.addEventListener("online", function() {

    kemasKiniOfflineStatus();

    clearTimeout(onlineTimer);

    onlineTimer = setTimeout(
      syncOfflineQueue,
      800
    );

  });

  window.addEventListener("offline", function() {

    kemasKiniOfflineStatus();

  });

  setInterval(function() {

    if (navigator.onLine) {
      syncOfflineQueue();
    } else {
      kemasKiniOfflineStatus();
    }

  }, 15000);

}


// ============================================================
// SCANNER USB
// ============================================================

let usbBuffer = "";
let usbTimer = null;
let usbMode = false;

function mulaScanUSB() {

  hentikanSemuaKamera();

  document.getElementById("mainMenu").classList.add("hidden");
  document.getElementById("photoMode").classList.add("hidden");
  document.getElementById("attendanceMode").classList.remove("hidden");

  document.getElementById("reader").innerHTML = "";
  document.getElementById("result").innerHTML = "";

  document.getElementById("status").className = "info";
  document.getElementById("status").innerHTML =
    "🔌 SCANNER USB SEDIA<br>Sila scan QR murid.";

  sedangProses = false;
  usbMode = true;
  usbBuffer = "";

  let input = document.getElementById("usbInput");

  if (!input) {
    input = document.createElement("input");
    input.id = "usbInput";
    input.type = "text";
    input.autocomplete = "off";
    input.autocorrect = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;

    input.style.position = "fixed";
    input.style.left = "-10000px";
    input.style.top = "0";
    input.style.width = "1px";
    input.style.height = "1px";
    input.style.opacity = "0";

    document.body.appendChild(input);

    input.addEventListener("keydown", function(e) {

      if (!usbMode) return;

      if (e.key === "Enter") {

        e.preventDefault();
        e.stopPropagation();

        prosesInputUSB();
      }
    });
  }

  input.value = "";
  input.focus();

  document.addEventListener("click", fokusSemulaUSB);
}


// ============================================================
// PROSES INPUT SCANNER USB
// ============================================================

function prosesInputUSB() {

  if (!usbMode || sedangProses) {
    return;
  }

  const input = document.getElementById("usbInput");

  if (!input) {
    return;
  }

  const qrID = input.value.trim();

  if (!qrID) {
    return;
  }

  // KOSONGKAN INPUT DAHULU
  input.value = "";

  // KUNCI SEBELUM HANTAR KE API
  sedangProses = true;

  document.getElementById("status").className = "info";
  document.getElementById("status").innerHTML =
    "🔌 KOD SCANNER DITERIMA: <b>" +
    escapeHtml(qrID) +
    "</b><br>⏳ Menghantar ke sistem...";

  // HANTAR SEKALI SAHAJA
  prosesQR(qrID);
}


// ============================================================
// KEKALKAN FOKUS UNTUK SCANNER
// ============================================================

function fokusSemulaUSB() {

  if (!usbMode || sedangProses) {
    return;
  }

  const input = document.getElementById("usbInput");

  if (input) {
    input.focus();
  }
}


// ============================================================
// HENTIKAN SCANNER USB
// ============================================================

function hentikanScannerUSB() {

  usbMode = false;
  usbBuffer = "";

  const input = document.getElementById("usbInput");

  if (input) {
    input.value = "";
    input.blur();
  }

  document.removeEventListener("click", fokusSemulaUSB);
}

// ============================================================
// MULA SCAN KEHADIRAN
// ============================================================

function mulaScan() {

  hentikanSemuaKamera();
  scanBerterusan = true;
  scanBolehTerima = true;
  qrDalamProses = "";
  qrSudahDibaca = new Set();
  sediaAudioScan();

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("photoMode")
    .classList.add("hidden");

  document.getElementById("attendanceMode")
    .classList.remove("hidden");


  // Kamera sentiasa terbuka selepas berjaya membaca satu QR.
  sedangProses = false;


  document.getElementById("againButton")
    .style.display = "none";


  document.getElementById("result")
    .innerHTML = "";


  document.getElementById("status")
    .className = "info";

  document.getElementById("status")
    .innerHTML =
      "📷 Membuka kamera...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {
      if (!scanBerterusan || !scanBolehTerima || sedangProses) return;

      const qrID = String(decodedText || "").trim();
      if (!qrID || qrSudahDibaca.has(qrID.toUpperCase())) return;

      // Kunci dahulu sebelum proses supaya frame yang sama tidak menulis rekod berganda.
      scanBolehTerima = false;
      sedangProses = true;
      qrDalamProses = qrID;
      const masaDikesan = new Date();

      // TIDAK panggil hentikanScanner() di sini.
      // Kamera kekal berjalan untuk QR murid berikutnya.
      prosesQR(qrID, masaDikesan);

    },

    function(errorMessage) {

      // Abaikan QR yang belum dikesan.

    }

  ).catch(function(error) {

    console.error(error);

    sedangProses = false;

    document.getElementById("status")
      .className = "error";

    document.getElementById("status")
      .innerHTML =
        "❌ Kamera tidak dapat dibuka.<br>" +
        "Sila benarkan akses kamera.";

  });

}

          .innerHTML = "";

      });

  } catch (e) {

    scanner = null;

  }

}


// ============================================================
// PROSES QR KEHADIRAN
// ============================================================

function prosesQR(qrID, masaDikesan) {

  // Masa ini diambil sebaik QR dikesan oleh kamera, bukan ketika upload.
  // USB masih menggunakan masa semasa apabila kod diterima.
  const masaScanAsal = masaDikesan instanceof Date ? masaDikesan : new Date();

  qrID = String(qrID || "").trim();

  if (!qrID) {

    sedangProses = false;
    return;

  }

  // Jika tiada internet, simpan terus ke queue.
  if (!navigator.onLine) {

    simpanDanMaklumOffline(qrID, masaScanAsal);
    return;

  }

  document.getElementById("status")
    .className = "info";

  document.getElementById("status")
    .innerHTML =
      "⏳ QR dikesan. Sedang semak murid...";


  const callbackName =
    "hasilScan_" + Date.now();

  let networkTimeout;


  window[callbackName] =
    function(response) {

      clearTimeout(networkTimeout);

      paparKeputusan(response);

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement("script");


  script.id = callbackName;


  script.src =
    API_URL +
    "?action=scan" +
    "&qr=" +
    encodeURIComponent(qrID) +
    "&scannedAt=" +
    encodeURIComponent(masaScanAsal.toISOString()) +
    "&scanEpochMs=" +
    encodeURIComponent(masaScanAsal.getTime()) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      clearTimeout(networkTimeout);

      delete window[callbackName];

      if (script.parentNode) {
        script.remove();
      }

      simpanDanMaklumOffline(qrID, masaScanAsal);

    };


  // Jika sambungan tergantung terlalu lama,
  // simpan QR ke queue supaya scan tidak tersekat.
  networkTimeout = setTimeout(function() {

    delete window[callbackName];

    if (script.parentNode) {
      script.remove();
    }

    simpanDanMaklumOffline(qrID, masaScanAsal);

  }, 10000);


  document.body.appendChild(script);

}


// ============================================================
// PAPAR KEPUTUSAN KEHADIRAN
// ============================================================

function paparKeputusan(response) {

  if (!response) {

    document.getElementById("status")
      .className = "error";

    document.getElementById("status")
      .innerHTML =
        "❌ Tiada respons daripada sistem.";

    resetScanner();

    return;

  }


  if (response.already) {

    simpanQRScanBerterusan();
    document.getElementById("status")
      .className = "error";

    document.getElementById("status")
      .innerHTML =
        "⚠️ SUDAH DIREKOD HARI INI";

    paparMurid(response);

    return;

  }


  if (!response.success) {

    document.getElementById("status")
      .className = "error";

    document.getElementById("status")
      .innerHTML =
        "❌ MURID TIDAK DIJUMPAI";


    document.getElementById("result")
      .innerHTML =
        "<div class='student'>" +
        "<div class='detail'>" +
        escapeHtml(response.message) +
        "</div>" +
        "</div>";


    resetScanner();

    return;

  }


  simpanQRScanBerterusan();
  bunyiTahniah();

  document.getElementById("status")
    .className = "success";

  document.getElementById("status")
    .innerHTML =
      "✅ TAHNIAH! KEHADIRAN BERJAYA DIREKOD";


  paparMurid(response);

}

      escapeHtml(response.rmt) +

      "</div>" +

}


// ============================================================
// RESET SCANNER
// ============================================================

function resetScanner() {

  if (scanBerterusan && scanner && !usbMode) {
    // Tunjuk keputusan sekejap, kemudian terima QR lain tanpa hentikan kamera.
    clearTimeout(timerScanSeterusnya);
    document.getElementById("againButton").style.display = "none";
    timerScanSeterusnya = setTimeout(function() {
      if (!scanBerterusan || !scanner || usbMode) return;
      qrDalamProses = "";
      sedangProses = false;
      scanBolehTerima = true;
      document.getElementById("status").className = "info";
      document.getElementById("status").innerHTML =
        "📷 SEDIA UNTUK MURID SETERUSNYA · TIDAK PERLU TEKAN BUTANG";
    }, 1300);
    return;
  }

  // Mode lain kekal seperti kod asal.
  sedangProses = false;
  document.getElementById("againButton").style.display = "inline-block";

}

// ============================================================
// AMBIL GAMBAR
// ============================================================

function ambilGambar() {

  if (!muridUntukGambar) {

    alert("Murid belum dipilih.");

    return;

  }


  const video =
    document.getElementById("photoCamera");

  const canvas =
    document.getElementById("photoCanvas");


  let width =
    video.videoWidth;

  let height =
    video.videoHeight;


  if (!width || !height) {

    alert("Kamera belum bersedia.");

    return;

  }


  // Hadkan saiz gambar supaya fail tidak terlalu besar

  const maxWidth = 800;


  if (width > maxWidth) {

    height =
      Math.round(
        height * maxWidth / width
      );

    width = maxWidth;

  }


  canvas.width = width;

  canvas.height = height;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  gambarBase64 =
    canvas.toDataURL(
      "image/jpeg",
      0.75
    );


  document.getElementById("photoPreview")
    .src = gambarBase64;


  document.getElementById("photoPreview")
    .style.display = "block";


  hentikanKameraGambar();


  video.classList.add("hidden");


  document.getElementById("captureButton")
    .classList.add("hidden");


  document.getElementById("saveButton")
    .classList.remove("hidden");


  document.getElementById("retakeButton")
    .classList.remove("hidden");


  document.getElementById("photoNote")
    .innerHTML =
      "Gambar sudah diambil. Semak dahulu sebelum simpan.";

}

// ============================================================
// SIMPAN GAMBAR
// ============================================================

function simpanGambar() {

  if (!muridUntukGambar) {

    alert("Murid belum dipilih.");

    return;

  }


  if (!gambarBase64) {

    alert("Sila ambil gambar dahulu.");

    return;

  }


  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;


  document.getElementById("photoStatus")
    .className = "info";

  document.getElementById("photoStatus")
    .innerHTML =
      "💾 Sedang menyimpan gambar...";


  const fileName =
    muridUntukGambar.id +
    "_" +
    muridUntukGambar.nama
      .replace(/[^a-zA-Z0-9_-]/g, "_") +
    ".jpg";


  const payload = {

    row:
      muridUntukGambar.row,

    base64Data:
      gambarBase64,

    fileName:
      fileName

  };


  fetch(
    API_URL,
    {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(payload)

    }

  )

  .then(function(response) {

    return response.text();

  })

  .then(function(text) {

    let result;

    try {

      result =
        JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Respons server tidak sah."
      );

    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gambar gagal disimpan."
      );

    }


    document.getElementById("photoStatus")
      .className = "success";

    document.getElementById("photoStatus")
      .innerHTML =
        "✅ GAMBAR BERJAYA DISIMPAN";


    document.getElementById("saveButton")
      .classList.add("hidden");


    document.getElementById("retakeButton")
      .classList.add("hidden");


    document.getElementById("photoNote")
      .innerHTML =
        "Gambar telah disimpan ke DATA MURID.";

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("photoStatus")
      .className = "error";

    document.getElementById("photoStatus")
      .innerHTML =
        "❌ Gagal menyimpan gambar.<br>" +
        escapeHtml(error.message);

  })

  .finally(function() {

    saveButton.disabled = false;

  });

}

// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(text) {

  return String(text || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}
